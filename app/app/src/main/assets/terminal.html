<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes" />
<link rel="stylesheet" href="vendor/xterm.min.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #14161a; }
  /* A PC grid larger than the phone pans here instead of shrinking the glyphs below a readable size. */
  #term { position: absolute; inset: 0; overflow: auto; }
</style>
</head>
<body>
<div id="term"></div>
<script src="vendor/xterm.min.js"></script>
<script>
const term = new Terminal({ fontSize: 13, lineHeight: 1.2, theme: { background: '#14161a' } });
term.open(document.getElementById('term'));

function enc(s) { const u = new TextEncoder().encode(s); let b = ''; for (const c of u) b += String.fromCharCode(c); return btoa(b); }

term.onData((d) => { try { Android.input(enc(d)); } catch (e) {} });

window.termOut = function (b64) {
  const bin = atob(b64);
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  term.write(u);
};

// The terminal runs on the PC at the PC's size; the phone pans a grid that is wider than it is.
window.termSize = function (cols, rows) {
  term.resize(cols, rows);
};

// The phone's font size control. The cell comes with the size because xterm re-measures its grid
// from the font: setting fontSize alone would move the glyphs and leave the cell behind.
// cellWidth is the declared advance the phone reviews; xterm's monospace measure matches it.
window.termFont = function (px, cellWidth, cellHeight) {
  term.options.fontSize = px;
  term.options.lineHeight = cellHeight / px;
};

// The selection a long press made. The phone copies this text and never clears it.
window.termSelection = function () { try { return term.getSelection(); } catch (e) { return ''; } };
</script>
</body>
</html>
