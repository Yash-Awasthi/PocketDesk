[versions]
# Stable lines only. AGP 9.5.x is the newest stable line that takes `compileSdk 37.2` (max API 37);
# Kotlin 2.4.21 is the newest stable language release (2.5.0 is still Beta/RC); Compose BOM
# 2026.11.01 is the Compose 1.13 stable BOM, which itself needs compileSdk 37.1+ and Kotlin 2.2+.
# Anything here that is a pre-release must carry a `# prerelease:` note on its line.
agp = "9.5.2"
kotlin = "2.4.21"
composeBom = "2026.11.01"
activity = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.1"
navigation3 = "1.2.2"
okhttp = "5.5.0"
coroutines = "1.11.0"
serialization = "1.13.0"
iroh = "1.1.0"
jna = "5.19.1"
codeScanner = "16.1.0"
docScanner = "16.0.0"
zxing = "3.5.3"
junit = "6.1.3"
# JUnit 4 runner for Robolectric/Roborazzi; the Jupiter tests still run through the platform.
junit4 = "4.13.2"
androidxTestJunit = "1.3.0"
androidxTestRunner = "1.7.0"
# CycloneDX SBOM for the release APK; reads the resolved runtime graph only.
cyclonedx = "3.6.1"
# Host-side Android runtime (JVM) for the golden screenshots.
robolectric = "4.18.1"
# Golden-image capture and comparison on top of Robolectric.
roborazzi = "1.79.0"
# Macrobenchmark + baseline-profile generator, same 1.5.0 release train. UIAutomator drives the
# screens the benchmarks scroll; it is a device-only test dependency.
macrobenchmark = "1.5.0"
baselineprofile = "1.5.0"
uiautomator = "2.4.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
iroh-android = { module = "computer.iroh:iroh-android", version.ref = "iroh" }
code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
doc-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "docScanner" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestRunner" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "macrobenchmark" }
benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "macrobenchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }

[plugins]
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
