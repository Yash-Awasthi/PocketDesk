<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PocketDesk Phone</title>
<link rel="stylesheet" href="/ui/app.css" />
<link rel="manifest" href="/ui/manifest.webmanifest" />
<link rel="icon" href="/ui/icon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0d1117" />
</head>
<body>
<div id="login">
  <div class="login-card">
    <div class="brand">PocketDesk</div>
    <div class="dim">Your phone on this PC</div>
    <input id="token" placeholder="Token from %USERPROFILE%\.pocketdesk\config.json" />
    <button class="primary" onclick="PD.connect()">Connect</button>
    <div id="loginStatus" class="dim">disconnected</div>
  </div>
</div>

<div id="shell">
  <nav id="side">
    <div class="brand">PocketDesk</div>
    <div id="nav"></div>
  </nav>
  <main>
    <header>
      <h1 id="pageTitle"></h1>
      <span class="gap"></span>
      <span id="conn" class="pill">Offline</span>
      <button id="themeBtn" class="ic" title="Light, dark or system theme" aria-label="Theme"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6"/><path d="M10 4a6 6 0 0 0 0 12z" fill="currentColor"/></svg></button>
    </header>
    <div id="pages"></div>
  </main>
</div>

<div id="pwins"></div>
<div id="callPop" class="card" hidden></div>
<div id="toasts"></div>

<script src="/vendor/qrcode.min.js"></script>
<script src="/ui/core.js"></script>
<script src="/ui/phone.js"></script>
<script src="/ui/hub.js"></script>
<script src="/ui/share.js"></script>
<script src="/ui/pages.js"></script>
<script src="/ui/extras.js"></script>
</body>
</html>
