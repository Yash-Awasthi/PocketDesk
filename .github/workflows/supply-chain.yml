name: Supply chain

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (what a user installs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - run: npm ci
      # Shipped dependencies only: the dev-only advisories and why they are deferred are
      # recorded in docs/dependency-log.md, and their only fix today is a breaking c8 downgrade.
      - name: Audit the shipped daemon
        run: npm audit --omit=dev --audit-level=moderate

  cargo-audit:
    name: cargo audit (native helpers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # The workspace keeps no lock file in the tree, so the audit needs one generated first.
      - name: Generate a lock file and audit it
        run: cargo generate-lockfile && cargo audit

  gradle-verification:
    name: Gradle dependency verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # Every artifact is checked against app/gradle/verification-metadata.xml on the way in,
      # so a missing or changed SHA-256 fails the configuration before anything compiles.
      - name: Resolve with checksums enforced
        working-directory: app
        run: chmod +x gradlew && ./gradlew --no-daemon help
      - name: The metadata is committed
        run: test -s app/gradle/verification-metadata.xml

  sbom:
    name: SBOM (daemon and APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      # The lock file is the input, so the BOM lists exactly what a user installs.
      - name: Daemon SBOM from the lock file
        working-directory: daemon
        run: >
          npx --yes @cyclonedx/cyclonedx-npm@7.0.1 --package-lock-only --omit dev
          --output-reproducible --output-format json --spec-version 1.5
          --output-file sbom/daemon.cdx.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      # The release runtime graph only: what the APK ships, not test or debug jars.
      - name: APK SBOM from the release runtime graph
        working-directory: app
        run: chmod +x gradlew && ./gradlew --no-daemon :app:cyclonedxDirectBom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            daemon/sbom/daemon.cdx.json
            app/app/build/reports/pocketdesk-apk-sbom.json
          if-no-files-found: error
