name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the platform the daemon ships on (ConPTY, tasklist, tray).
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4
        with:
          # tools-ui.test.mjs reads recent commits of this repo through git_log.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in $(git ls-files 'src/*.js' 'scripts/*.js' 'scripts/*.mjs'); do node --check "$f" || exit 1; done
      - name: Run test suite
        run: npm test

  android:
    name: Android lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Lint, unit tests, debug APK
        working-directory: app
        run: chmod +x gradlew && ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/app/build/reports/
            app/app/build/test-results/
          retention-days: 14
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDesk-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
