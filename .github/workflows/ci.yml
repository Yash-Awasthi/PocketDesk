name: PocketDesk CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: node --test daemon/src/__tests__/*.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

  build:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify project structure
        run: |
          echo "✅ Checking project structure..."
          test -f daemon/src/server.js
          test -d daemon/src/plugins
          test -d daemon/src/channels
          echo "✅ Structure OK"

      - name: Count modules
        run: |
          echo "📊 Daemon modules:"
          find daemon/src -name "*.js" | wc -l
          echo "📊 Plugins:"
          find daemon/src/plugins -name "*.js" 2>/dev/null | wc -l || echo "0"
          echo "📊 Notification channels:"
          find daemon/src/channels -name "*.js" 2>/dev/null | wc -l || echo "0"
