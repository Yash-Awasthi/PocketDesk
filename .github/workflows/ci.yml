name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: Daemon tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the main platform (ConPTY, console endpoint); macOS and Linux run the hidden daemon too.
        os: [windows-latest, ubuntu-latest, macos-latest]
        # 24 is the supported floor, 26 the current release.
        node: [24, 26]
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v7
        with:
          # tools-ui.test.mjs reads recent commits of this repo through git_log.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in $(git ls-files 'src/*.js' 'scripts/*.js' 'scripts/*.mjs'); do node --check "$f" || exit 1; done
      - name: Compile the Windows launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /out:$env:RUNNER_TEMP\PocketDeskLauncher.exe /r:System.dll scripts\PocketDeskLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $csc /nologo /target:exe /out:$env:RUNNER_TEMP\PocketDeskConsole.exe /r:System.dll scripts\console\PocketDeskConsole.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in "..\install.ps1", "..\uninstall.ps1", "scripts\install-service.ps1") {
            $errs = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Error "$f $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          }
      - name: Run test suite
        run: npm test

  android:
    name: Android lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint, unit tests, debug APK
        working-directory: app
        run: chmod +x gradlew && ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon
      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            app/app/build/reports/
            app/app/build/test-results/
          retention-days: 14
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: PocketDesk-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      # The signing key exists only in these secrets, so every release APK is built here.
      - name: Signed release APK
        if: github.event_name != 'pull_request'
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > pocketdesk.keystore
          printf 'storeFile=pocketdesk.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          ./gradlew assembleRelease --no-daemon
          rm pocketdesk.keystore keystore.properties
      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: PocketDesk-release-apk
          path: app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  native:
    name: Windows helpers (webcam, controller)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release
      - name: Test
        run: cargo test --release
      # Attached to a release as PocketDesk-native-win-x64.zip; install.ps1 unpacks it into <install>\native.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target\release\pocketdesk_vcam.dll, target\release\pocketdesk-vcam-host.exe, target\release\pocketdesk-pad.exe, vcam\assets\OFL-Figtree.txt out\
          Compress-Archive out\* PocketDesk-native-win-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: PocketDesk-native-win-x64
          path: native/PocketDesk-native-win-x64.zip
          retention-days: 30
